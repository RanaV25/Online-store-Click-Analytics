name: Model Training

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

jobs:
  train:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate training script
        run: |
          python -m py_compile train_category_models.py backup_database.py hourly_retraining_job.py

      - name: Training note
        run: |
          echo "This workflow is scaffolded. Add a secure DB backup download step before running real training."
